# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # NO DEPENDENCY-UPDATE ECOSYSTEM WORKS FOR A BUN-MANAGED DIRECTORY. Both options fail and each
  # error recommends the other, so the entry was REMOVED rather than left failing weekly:
  #   bun -> "Unsupported bun.lock 'lockfileVersion' 2" - its bundled bun reads v1, Bun 1.4 writes v2.
  #   npm -> "npm_and_yarn ecosystem cannot update bun.lock. Set package-ecosystem: bun" - this
  #          aborts during FILE FETCHING, so nothing is proposed for ANY directory in the entry.
  # npm_and_yarn worked until upstream added that abort between 2026-09-23 and 2026-09-25.
  # COST: security ALERTS still fire (they are dependency-graph based) but nothing proposes the
  # fix, so "0 open Dependabot PRs" now partly means "Dependabot cannot open one". A bump is a
  # human action: `bun outdated`, then `bun update <pkg>`, then commit the regenerated bun.lock.
  # REVISIT, and it is checkable: re-add `package-ecosystem: bun` once its bundled bun reads
  # lockfileVersion 2. Set it, watch ONE scheduled run - the failure is immediate and costs nothing.
  # Do NOT pin Bun back to 1.3.14 for a v1 lockfile: that downgrades the toolchain around a vendor bug.

  # This repo had NO github-actions entry, so removing the npm one would have left `updates:`
  # empty, which Dependabot rejects. It also had no action updates at all, while using seven
  # action references - three SHA-pinned, the rest on floating major tags. Added here rather
  # than leaving the file invalid.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
