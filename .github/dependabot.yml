# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # npm dependencies in root
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    # Group updates by dependency type
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Commit message configuration
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    # Security updates
    labels:
      - "dependencies"
      - "automated"
    reviewers:
      - "danielsimonjr"
    ignore:
      # TypeScript 7 is un-adoptable until the lint toolchain supports it:
      # @typescript-eslint/eslint-plugin@8.63.0 (latest) declares
      # `peer typescript: >=4.8.4 <6.1.0`, so `npm ci` fails with ERESOLVE.
      # Remove this ignore once @typescript-eslint ships TS 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # npm dependencies in wasm subdirectory
  - package-ecosystem: "npm"
    directory: "/wasm"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(wasm)"
    labels:
      - "dependencies"
      - "wasm"
      - "automated"
    reviewers:
      - "danielsimonjr"
