# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # npm, not bun, DELIBERATELY. Dependabot parses only bun.lock lockfileVersion 1 and Bun
  # writes 2, so every bun updater run failed with "Unsupported bun.lock lockfileVersion 2"
  # and NO dependency update was proposed (verified on memory-mcp / fzf-mcp). Security
  # alerts keep working (dependency-graph based); automated remediation is what dies under
  # the bun ecosystem.
  #
  # No package-lock.json is committed, so npm updates package.json ranges only and bun.lock
  # stays authoritative — regenerated by `bun install`, never by Dependabot. A second
  # committed lockfile would be a second source of truth to drift.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    # Group updates by dependency type
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Commit message configuration
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    # Security updates
    labels:
      - "dependencies"
      - "automated"
    reviewers:
      - "danielsimonjr"
    ignore:
      # TypeScript 7 is un-adoptable until the lint toolchain supports it:
      # @typescript-eslint/eslint-plugin@8.63.0 (latest) declares
      # `peer typescript: >=4.8.4 <6.1.0`, so installs fail with ERESOLVE.
      # Remove this ignore once @typescript-eslint ships TS 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
