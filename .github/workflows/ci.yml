name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  # An auto-merged Dependabot PR is pushed with GITHUB_TOKEN, and GitHub's recursion guard
  # suppresses workflow triggers for those pushes -- so the default branch can carry a
  # dependency commit with NO run at all. Measured 2026-08-28 across this repo's history.
  # The PR gate still holds (branch protection requires the checks), so what is lost is
  # post-merge telemetry, not the gate. A nightly run re-exercises the branch regardless of
  # who pushed it; workflow_dispatch allows a gap to be backfilled on the spot.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

# Pinned explicitly rather than inheriting the repository default. The default is `read`
# today, but it is a repo-level setting that any future change can widen silently. These
# jobs only check out, build, test and upload an artifact, so they never need more.
permissions:
  contents: read

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Node 20 EOL 2026-04. Bun is the install/script toolchain; Node remains the
        # shipped MCP runtime (consumers launch `node dist/index.js`).
        node-version: [22.x, 24.x]

    steps:
      # Bun needs no repository content, so it is safe ahead of checkout. Jobs that
      # invoke bun must install it themselves — do not assume setup-node provides it.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: actions/checkout@v7

      # BOTH runtimes on purpose: Bun is the TypeScript-on-Bun toolchain (install +
      # scripts); Node is what this server SHIPS on. Dropping setup-node would remove
      # the only thing that proves the published artifact still loads for consumers.
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build TypeScript
        run: bun run build

      - name: Node runtime smoke (the shipped artifact must load under Node)
        run: |
          node --input-type=module -e '
            const entry = "./dist/index.js";
            const t = setTimeout(() => { console.log("PASS: self-started under Node (still running at 5s)"); process.exit(0); }, 5000);
            import(entry).then(() => { clearTimeout(t); console.log("PASS: loaded cleanly under Node"); process.exit(0); })
              .catch((e) => { clearTimeout(t); console.error("FAIL: " + entry + " does not load under Node -- " + e.message); process.exit(1); });
          '

      - name: Run integration tests
        run: bun run test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-node${{ matrix.node-version }}
          path: test/test-results/

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check TypeScript
        run: bun run type-check

  # Non-required on purpose. No other job reads the architecture documents, so a claim that drifts
  # from the source turns no check red. This job reads the committed documents against the committed
  # source and writes nothing. It needs no Bun and no `bun install`: the command runs on a bare
  # checkout. The version is pinned in one place, so a new release of `repo-tools` cannot turn this
  # check red on its own. Raise the pin in a pull request that also re-measures the documents. This
  # job does not change branch protection. The check name says non-required so a reader does not
  # mistake it for one of the required contexts.
  architecture-docs-claims:
    name: architecture-docs claims (non-required)
    runs-on: ubuntu-latest
    env:
      REPO_TOOLS_VERSION: '2.3.0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'

      - name: Install the pinned repo-tools
        run: npm install --global @danielsimonjr/repo-tools@${REPO_TOOLS_VERSION}

      - name: Fail when an architecture document claim no longer matches the source
        run: repo-tools check . --docs=docs/architecture
