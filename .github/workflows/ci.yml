name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  # An auto-merged Dependabot PR is pushed with GITHUB_TOKEN, and GitHub's recursion guard
  # suppresses workflow triggers for those pushes -- so the default branch can carry a
  # dependency commit with NO run at all. Measured 2026-08-28 across this repo's history.
  # The PR gate still holds (branch protection requires the checks), so what is lost is
  # post-merge telemetry, not the gate. A nightly run re-exercises the branch regardless of
  # who pushed it; workflow_dispatch allows a gap to be backfilled on the spot.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Node 18 EOL 2026-04; toolchain needs node:util styleText (Node 20.12+)
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run integration tests
        run: node test/integration-test.js

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-node${{ matrix.node-version }}
          path: test/test-results/

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit
